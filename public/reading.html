<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Reading, with Benjamin | Sage of Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #12142B;
    --void-deep: #0E1024;
    --plum: #241832;
    --plum-light: #2C1F3D;
    --parchment: #F0E8D8;
    --gold: #C9A227;
    --gold-lit: #E0BC4A;
    --copper: #C06B33;
    --lavender: #9C96B8;
    --line: rgba(240,232,216,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background: var(--void-deep);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }
  header.top{
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--void-deep);
    z-index: 10;
  }
  .benjamin-avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #3a2f52, var(--plum) 70%);
    border: 1px solid var(--line);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-size: 16px;
    color: var(--gold-lit);
  }
  .header-text{ line-height: 1.3; }
  .header-name{
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--gold);
  }
  .header-status{
    font-size: 12px;
    color: var(--lavender);
  }
  .header-status.live::before{
    content: '';
    display:inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-lit);
    margin-right: 6px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.3; }
  }

  main{
    flex:1;
    max-width: 620px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px 140px;
  }

  .msg{
    display:flex;
    gap: 12px;
    margin-bottom: 22px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.5s ease forwards;
  }
  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }
  .msg .avatar-small{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #3a2f52, var(--plum) 70%);
    border: 1px solid var(--line);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-size: 13px;
    color: var(--gold-lit);
    margin-top: 2px;
  }
  .bubble{
    background: var(--plum);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px 16px;
    max-width: 480px;
    font-size: 15.5px;
  }
  .bubble.commentary{
    background: transparent;
    border: none;
    padding: 4px 0;
    font-style: italic;
    color: var(--lavender);
    font-family: 'Fraunces', serif;
    font-size: 15px;
  }
  .bubble.section{
    background: var(--plum);
  }
  .section-label{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--copper);
    margin-bottom: 8px;
    display:block;
  }
  .bubble.clash{
    background: var(--plum-light);
    border-color: var(--gold);
  }
  .bubble.clash .section-label{
    color: var(--gold-lit);
  }

  .typing-indicator{
    display:flex;
    gap: 5px;
    padding: 16px 18px;
    background: var(--plum);
    border: 1px solid var(--line);
    border-radius: 3px;
    width: fit-content;
  }
  .typing-indicator span{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--lavender);
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2){ animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity: 0.5; }
    30%{ transform: translateY(-4px); opacity: 1; }
  }

  #connecting-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 80px 20px;
    text-align:center;
  }
  #connecting-screen .benjamin-avatar{
    width: 64px;
    height: 64px;
    font-size: 26px;
    margin-bottom: 20px;
  }
  #connecting-screen h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin-bottom: 8px;
  }
  #connecting-screen p{
    color: var(--lavender);
    font-size: 14px;
  }

  #continue-area{
    display:none;
    margin-top: 28px;
    text-align:center;
  }
  button.continue-btn{
    background: var(--gold);
    color: var(--void-deep);
    border: none;
    border-radius: 3px;
    padding: 16px 32px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    min-height: 44px;
  }
  button.continue-btn:hover{ background: var(--gold-lit); }

  #error-region{
    display:none;
    background: rgba(192,107,51,0.12);
    border: 1px solid rgba(192,107,51,0.4);
    border-radius: 3px;
    padding: 16px 18px;
    font-size: 14px;
    margin: 20px 0;
  }
  #error-region a{ color: var(--gold-lit); }

  #exit-modal{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(14,16,36,0.88);
    z-index: 100;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  #exit-modal.open{ display:flex; }
  .exit-card{
    background: var(--plum);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 30px 26px;
    max-width: 400px;
    text-align:center;
  }
  .exit-card .benjamin-avatar{
    margin: 0 auto 14px;
  }
  .exit-card h3{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    margin-bottom: 10px;
  }
  .exit-card p{
    font-size: 14.5px;
    color: var(--parchment);
    opacity: 0.85;
    margin-bottom: 22px;
  }
  .exit-actions{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .exit-stay{
    background: var(--gold);
    color: var(--void-deep);
    border:none;
    border-radius: 3px;
    padding: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor:pointer;
    min-height:44px;
  }
  .exit-leave{
    background: none;
    border: none;
    color: var(--lavender);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px;
  }

  .choice-row{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
  }
  .choice-btn{
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--parchment);
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    min-height: 40px;
  }
  .choice-btn:hover:not(:disabled){
    border-color: var(--gold);
    background: rgba(201,162,39,0.06);
  }
  .choice-btn.selected{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--void-deep);
    font-weight: 600;
  }
  .choice-btn:disabled{
    cursor: default;
    opacity: 0.55;
  }
  .choice-btn.selected:disabled{
    opacity: 1;
  }

  [role="alert"]{}
</style>
</head>
<body>

<header class="top">
  <div class="benjamin-avatar">B</div>
  <div class="header-text">
    <div class="header-name">Benjamin</div>
    <div class="header-status live" id="header-status">Reading your palm</div>
  </div>
</header>

<main>
  <div id="connecting-screen">
    <div class="benjamin-avatar">B</div>
    <h2>Connecting…</h2>
    <p>Benjamin is opening your photo now.</p>
  </div>

  <div id="chat-log" aria-live="polite" style="display:none;"></div>

  <div id="error-region" role="alert"></div>

  <div id="continue-area">
    <button class="continue-btn" id="continue-btn">Where does this show up for you?</button>
  </div>
</main>

<div id="exit-modal" role="dialog" aria-modal="true">
  <div class="exit-card">
    <div class="benjamin-avatar">B</div>
    <h3>Your reading is still open.</h3>
    <p>What's in your lines doesn't change if you leave. It only goes unread. This is free, and I'm already here.</p>
    <div class="exit-actions">
      <button class="exit-stay" id="exit-stay-btn">Stay with my reading</button>
      <button class="exit-leave" id="exit-leave-btn">Leave it unread</button>
    </div>
  </div>
</div>

<script>
(function(){
  const chatLog = document.getElementById('chat-log');
  const connectingScreen = document.getElementById('connecting-screen');
  const errorRegion = document.getElementById('error-region');
  const continueArea = document.getElementById('continue-area');
  const continueBtn = document.getElementById('continue-btn');
  const headerStatus = document.getElementById('header-status');
  const exitModal = document.getElementById('exit-modal');
  const exitStayBtn = document.getElementById('exit-stay-btn');
  const exitLeaveBtn = document.getElementById('exit-leave-btn');

  let readingComplete = false;
  let exitIntentArmed = true;

  const photoPreview = sessionStorage.getItem('benjamin_photo_preview');
  const name = sessionStorage.getItem('benjamin_name') || '';
  const email = sessionStorage.getItem('benjamin_email') || '';

  if (!photoPreview || !email) {
    window.location.href = '/optin.html';
    return;
  }

  function wait(ms){ return new Promise(res => setTimeout(res, ms)); }

  function dataURLtoBlob(dataURL){
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const binary = atob(parts[1]);
    const array = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) array[i] = binary.charCodeAt(i);
    return new Blob([array], { type: mime });
  }

  async function fetchReading(){
    const formData = new FormData();
    formData.append('photo', dataURLtoBlob(photoPreview), 'palm.jpg');
    formData.append('name', name);

    const res = await fetch('/api/benjamin-reading', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.rateLimited) {
      throw { type: 'rateLimited', message: data.message };
    }
    if (data.rejected) {
      throw { type: 'rejected', message: data.message };
    }
    if (data.error || !data.reading) {
      throw { type: 'error', message: data.message || 'Something went wrong generating your reading.' };
    }
    return data.reading;
  }

  function parseMarkers(text){
    const keys = ['HEART','HEAD','LIFE','FATE','CLASH'];
    const result = {};
    for (let i = 0; i < keys.length; i++){
      const key = keys[i];
      const startTag = '###' + key + '###';
      const startIdx = text.indexOf(startTag);
      if (startIdx === -1) continue;
      const contentStart = startIdx + startTag.length;
      let endIdx = text.length;
      for (let j = i+1; j < keys.length; j++){
        const nextTag = '###' + keys[j] + '###';
        const nextIdx = text.indexOf(nextTag, contentStart);
        if (nextIdx !== -1) { endIdx = nextIdx; break; }
      }
      result[key] = text.slice(contentStart, endIdx).trim();
    }
    return result;
  }

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function typeText(el, text, charsPerSecond){
    return new Promise(resolve => {
      if (prefersReducedMotion) {
        el.textContent = text;
        resolve();
        return;
      }
      let i = 0;
      const msPerChar = 1000 / charsPerSecond;
      // Batch a few characters per tick for smoother, less jittery pacing on longer text.
      const step = Math.max(1, Math.round(text.length / 220));
      function tick(){
        i += step;
        if (i >= text.length) {
          el.textContent = text;
          resolve();
          return;
        }
        el.textContent = text.slice(0, i);
        el.parentElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
        setTimeout(tick, msPerChar * step);
      }
      tick();
    });
  }

  function splitIntoChunks(text, sentencesPerChunk){
    const sentences = text.match(/[^.!?]+[.!?]+(\s+|$)/g) || [text];
    const chunks = [];
    for (let i = 0; i < sentences.length; i += sentencesPerChunk) {
      chunks.push(sentences.slice(i, i + sentencesPerChunk).join('').trim());
    }
    return chunks.length ? chunks : [text];
  }

  function waitForChoice(promptText, options){
    return new Promise(resolve => {
      const msg = document.createElement('div');
      msg.className = 'msg';
      const av = document.createElement('div');
      av.className = 'avatar-small';
      av.textContent = 'B';
      msg.appendChild(av);
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.gap = '10px';

      const bubble = document.createElement('div');
      bubble.className = 'bubble commentary';
      const p = document.createElement('div');
      bubble.appendChild(p);
      wrap.appendChild(bubble);

      const btnRow = document.createElement('div');
      btnRow.className = 'choice-row';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-btn';
        btn.textContent = opt.label;
        btn.addEventListener('click', function(){
          Array.from(btnRow.children).forEach(b => b.disabled = true);
          btn.classList.add('selected');
          setTimeout(() => resolve(opt.value), 250);
        });
        btnRow.appendChild(btn);
      });
      wrap.appendChild(btnRow);
      msg.appendChild(wrap);
      chatLog.appendChild(msg);
      msg.scrollIntoView({ behavior: 'smooth', block: 'end' });

      typeText(p, promptText, 38);
    });
  }
  async function appendBubble({ type, label, text, avatar, typewriter }){
    const msg = document.createElement('div');
    msg.className = 'msg';
    if (avatar) {
      const av = document.createElement('div');
      av.className = 'avatar-small';
      av.textContent = 'B';
      msg.appendChild(av);
    } else {
      const spacer = document.createElement('div');
      spacer.style.width = '32px';
      spacer.style.flexShrink = '0';
      msg.appendChild(spacer);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + type;
    if (label) {
      const lab = document.createElement('span');
      lab.className = 'section-label';
      lab.textContent = label;
      bubble.appendChild(lab);
    }
    const p = document.createElement('div');
    bubble.appendChild(p);
    msg.appendChild(bubble);
    chatLog.appendChild(msg);
    msg.scrollIntoView({ behavior: 'smooth', block: 'end' });

    if (typewriter === false) {
      p.textContent = text;
    } else {
      // Commentary lines type faster (feels conversational); section readings type
      // slightly slower (feels considered, and stays readable while still moving).
      const speed = type === 'commentary' ? 38 : 55;
      await typeText(p, text, speed);
    }
    return msg;
  }

  async function showTyping(duration){
    const msg = document.createElement('div');
    msg.className = 'msg';
    const av = document.createElement('div');
    av.className = 'avatar-small';
    av.textContent = 'B';
    msg.appendChild(av);
    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    ind.innerHTML = '<span></span><span></span><span></span>';
    msg.appendChild(ind);
    chatLog.appendChild(msg);
    msg.scrollIntoView({ behavior: 'smooth', block: 'end' });
    await wait(duration);
    msg.remove();
  }

  const checkpointAnswers = {};

  async function revealLine({ label, text, introLine, checkpoint }){
    await showTyping(1000);
    await appendBubble({ type: 'commentary', text: introLine, avatar: true });
    await wait(400);

    const chunks = splitIntoChunks(text, 2);
    for (let i = 0; i < chunks.length; i++){
      await showTyping(900);
      await appendBubble({
        type: 'section',
        label: i === 0 ? label : null,
        text: chunks[i],
        avatar: true
      });
      await wait(400);
    }

    if (checkpoint) {
      await wait(300);
      const answer = await waitForChoice(checkpoint.prompt, checkpoint.options);
      checkpointAnswers[checkpoint.key] = answer;
      const ack = checkpoint.acknowledge[answer] || checkpoint.acknowledge.default;
      if (ack) {
        await showTyping(900);
        await appendBubble({ type: 'commentary', text: ack, avatar: true });
      }
    }
    await wait(500);
  }

  async function runSequence(sections){
    chatLog.style.display = 'block';
    connectingScreen.style.display = 'none';

    await showTyping(1200);
    await appendBubble({ type: 'commentary', text: 'Alright. Let me look at this properly.', avatar: true });
    await wait(500);

    await revealLine({
      label: 'HEART LINE',
      text: sections.HEART,
      introLine: 'Starting with the heart line.',
      checkpoint: {
        key: 'heart',
        prompt: 'Does that sound closer to how you actually love, or how people assume you love?',
        options: [
          { label: "That's exactly it", value: 'accurate' },
          { label: "It's more complicated than that", value: 'complicated' }
        ],
        acknowledge: {
          accurate: "Good. That matters for what comes next.",
          complicated: "Fair. Most true things are.",
          default: "Noted."
        }
      }
    });

    await revealLine({
      label: 'HEAD LINE',
      text: sections.HEAD,
      introLine: 'Now the head line. This one usually tells on people.',
      checkpoint: {
        key: 'head',
        prompt: 'Do you make decisions this way on purpose, or does it just happen?',
        options: [
          { label: 'On purpose', value: 'deliberate' },
          { label: 'It just happens', value: 'automatic' }
        ],
        acknowledge: {
          deliberate: "That's rarer than you'd think.",
          automatic: "Then you're probably underselling how sharp it actually is.",
          default: "Noted."
        }
      }
    });

    await revealLine({
      label: 'LIFE LINE',
      text: sections.LIFE,
      introLine: 'Give me a second with the life line.',
      checkpoint: {
        key: 'life',
        prompt: 'Has this felt true for a while, or has something shifted recently?',
        options: [
          { label: "It's been true for a while", value: 'steady' },
          { label: "Something's shifted recently", value: 'shifted' }
        ],
        acknowledge: {
          steady: "That kind of consistency shows.",
          shifted: "That explains something about the next part.",
          default: "Noted."
        }
      }
    });

    await revealLine({
      label: 'FATE LINE',
      text: sections.FATE,
      introLine: "And the fate line. There's something here.",
      checkpoint: {
        key: 'fate',
        prompt: 'Does that internal compass feel steady right now, or a little shaky?',
        options: [
          { label: 'Steady', value: 'steady' },
          { label: 'A little shaky lately', value: 'shaky' }
        ],
        acknowledge: {
          steady: "Good to know. Hold onto that.",
          shaky: "That's worth sitting with, not fixing.",
          default: "Noted."
        }
      }
    });

    await showTyping(1400);
    await appendBubble({ type: 'clash', label: 'WHAT I NOTICED', text: sections.CLASH, avatar: true });
    await wait(600);

    try {
      sessionStorage.setItem('benjamin_checkins', JSON.stringify(checkpointAnswers));
    } catch(e){}

    headerStatus.textContent = 'Reading complete';
    headerStatus.classList.remove('live');
    readingComplete = true;
    exitIntentArmed = false;
    continueArea.style.display = 'block';
    continueArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function showError(type, message){
    connectingScreen.style.display = 'none';
    errorRegion.style.display = 'block';
    if (type === 'rejected') {
      errorRegion.innerHTML = '<strong>' + escapeHtml(message) + '</strong><br><br><a href="/optin.html">Try a different photo</a>';
    } else if (type === 'rateLimited') {
      errorRegion.textContent = message;
    } else {
      errorRegion.innerHTML = escapeHtml(message) + '<br><br><a href="/optin.html">Start over</a>';
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  continueBtn.addEventListener('click', function(){
    window.location.href = '/decision.html';
  });

  // Exit intent
  document.addEventListener('mouseleave', function(e){
    if (exitIntentArmed && !readingComplete && e.clientY <= 0) {
      exitModal.classList.add('open');
    }
  });
  exitStayBtn.addEventListener('click', function(){
    exitModal.classList.remove('open');
  });
  exitLeaveBtn.addEventListener('click', function(){
    window.location.href = '/optin.html';
  });

  // Kick off
  (async function(){
    try {
      await wait(1500);
      const rawReading = await fetchReading();
      sessionStorage.setItem('benjamin_reading', rawReading);
      const sections = parseMarkers(rawReading);
      if (!sections.HEART || !sections.CLASH) {
        throw { type: 'error', message: 'The reading came back incomplete. Please try again.' };
      }
      await runSequence(sections);
    } catch (err) {
      const type = err && err.type ? err.type : 'error';
      const message = err && err.message ? err.message : 'Something went wrong.';
      showError(type, message);
    }
  })();
})();
</script>

</body>
</html>
