<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Sage of Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110F;
    --ink-2:#1C1815;
    --card:#221D19;
    --edge:rgba(237,230,218,0.10);
    --edge-lit:rgba(224,162,74,0.45);
    --paper:#EDE6DA;
    --paper-dim:rgba(237,230,218,0.62);
    --lamp:#E0A24A;
    --lamp-hi:#F0BC6C;
    --muted:#9A8F82;
    --good:#7FAE8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.6;min-height:100vh;
    animation:pageIn .5s ease;
  }
  @keyframes pageIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @media (prefers-reduced-motion:reduce){
    body{ animation:none; }
  }
  .shell{max-width:480px;margin:0 auto;padding:0 22px;}
  header{
    padding:24px 0;
    display:flex;align-items:center;gap:11px;
  }
  .b-avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 34% 30%, #4A3B2C, #2A231D 72%);
    border:1px solid var(--edge-lit);
    display:flex;align-items:center;justify-content:center;color:var(--lamp-hi);
  }
  .b-avatar svg{width:60%;height:60%;}
  .bname{font-family:'Fraunces',serif;font-size:15px;}
  .btag{font-size:11.5px;color:var(--muted);}

  .demo-tag{
    display:inline-block;
    font-size:11px;letter-spacing:.06em;
    color:var(--muted);
    border:1px solid var(--edge);
    border-radius:20px;
    padding:4px 10px;
    margin-bottom:20px;
  }

  .summary{
    background:var(--card);border:1px solid var(--edge);border-radius:3px;
    padding:20px 22px;margin-bottom:22px;
  }
  .sum-row{
    display:flex;justify-content:space-between;
    font-size:14.5px;padding:9px 0;
    border-bottom:1px solid var(--edge);
  }
  .sum-row:last-child{border-bottom:none;padding-bottom:0;}
  .sum-row.total{
    font-family:'Fraunces',serif;font-size:19px;
    padding-top:14px;
  }
  .sum-row .muted{color:var(--muted);}

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .field{margin-bottom:15px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  input{
    width:100%;background:var(--ink-2);border:1px solid var(--edge);
    border-radius:3px;padding:13px 14px;font-size:16px;
    font-family:'Inter',sans-serif;color:var(--paper);
  }
  input:focus{outline:none;border-color:var(--edge-lit);}

  .pay{
    width:100%;background:var(--lamp);color:#191410;border:none;border-radius:2px;
    padding:16px;font-family:inherit;font-size:15.5px;font-weight:600;
    cursor:pointer;min-height:48px;margin-top:6px;
  }
  .pay:hover:not(:disabled){background:var(--lamp-hi);}
  .pay:disabled{opacity:.5;cursor:not-allowed;}

  .lock{
    display:flex;align-items:center;gap:7px;justify-content:center;
    font-size:12px;color:var(--muted);margin-top:14px;
  }
  .lock svg{width:12px;height:12px;}

  #err{
    display:none;color:#D19B8F;font-size:13px;margin-top:10px;
  }

  #processing, #success{
    display:none;
    text-align:center;padding:80px 10px;
  }
  .spin{
    width:34px;height:34px;margin:0 auto 20px;
    border:2px solid var(--edge);
    border-top-color:var(--lamp);
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #processing p, #success p{color:var(--muted);font-size:14px;}
  #success .tick{
    width:44px;height:44px;margin:0 auto 18px;
    border-radius:50%;
    border:1.5px solid var(--good);
    display:flex;align-items:center;justify-content:center;
    color:var(--good);
  }
  #success h2{
    font-family:'Fraunces',serif;font-weight:300;font-size:20px;margin-bottom:8px;color:var(--paper);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="b-avatar" id="hdrAvatar" aria-hidden="true"></div>
    <div>
      <div class="bname">Benjamin</div>
      <div class="btag">Almost there</div>
    </div>
  </header>
  <div class="demo-tag">Demo checkout, no real charge</div>

  <div id="form-wrap">
    <div class="summary" id="summary"></div>

    <form id="payForm">
      <div class="field">
        <label for="cardName">Name on card</label>
        <input type="text" id="cardName" autocomplete="cc-name" placeholder="Full name" required>
      </div>
      <div class="field">
        <label for="cardNum">Card number</label>
        <input type="text" id="cardNum" autocomplete="cc-number" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19" required>
      </div>
      <div class="row2">
        <div class="field">
          <label for="cardExp">Expiry</label>
          <input type="text" id="cardExp" autocomplete="cc-exp" placeholder="MM / YY" maxlength="7" required>
        </div>
        <div class="field">
          <label for="cardCvc">CVC</label>
          <input type="text" id="cardCvc" autocomplete="cc-csc" inputmode="numeric" placeholder="123" maxlength="4" required>
        </div>
      </div>
      <button type="submit" class="pay" id="payBtn">Pay</button>
      <div id="err" role="alert"></div>
      <div class="lock">
        <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.2" stroke="#9A8F82" stroke-width="1.3"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="#9A8F82" stroke-width="1.3"/></svg>
        This is a demo. No card is ever charged.
      </div>
    </form>
  </div>

  <div id="processing">
    <div class="spin"></div>
    <p id="procLabel">Processing your payment</p>
  </div>

  <div id="success">
    <div class="tick">
      <svg viewBox="0 0 16 16" fill="none" width="18" height="18"><path d="M2 8.5L6 12L14 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>Payment received</h2>
    <p id="successSub">Preparing your reading now.</p>
  </div>
</div>

<script>
(function(){
  var BENJAMIN_SVG = '<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="20" cy="15.5" r="7.2" stroke="currentColor" stroke-width="1.6"/>' +
    '<path d="M6 34c1.4-7.4 7.2-12.5 14-12.5S38.6 26.6 40 34" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M14.5 14.5c1.6 1.4 3.6 2.1 5.5 2.1s3.9-.7 5.5-2.1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>' +
    '</svg>';
  var hdrAv=document.getElementById('hdrAvatar');
  if(hdrAv){ hdrAv.innerHTML=BENJAMIN_SVG; hdrAv.style.color='var(--lamp-hi)'; }

  var params=new URLSearchParams(window.location.search);
  var bundle = params.get('bundle')==='1';
  var category = params.get('category')||sessionStorage.getItem('benjamin_category')||'';

  var LABELS={ career:'Career and Finances', love:'Love and Relationships', life:'Life Path and Timing', traits:'Inherent Traits and Potential' };
  var label = LABELS[category] || 'Your reading';
  var price = bundle ? 24 : 9;

  if(!bundle && !category){ window.location.href='/decision.html'; return; }

  var summary=document.getElementById('summary');
  if(bundle){
    summary.innerHTML =
      '<div class="sum-row"><span>All four areas</span><span class="muted">Career, Love, Life Path, Traits</span></div>' +
      '<div class="sum-row total"><span>Total</span><span>$24</span></div>';
  } else {
    summary.innerHTML =
      '<div class="sum-row"><span>Full reading</span><span class="muted">'+label+'</span></div>' +
      '<div class="sum-row total"><span>Total</span><span>$9</span></div>';
  }

  var form=document.getElementById('payForm');
  var payBtn=document.getElementById('payBtn');
  var err=document.getElementById('err');
  var formWrap=document.getElementById('form-wrap');
  var processing=document.getElementById('processing');
  var success=document.getElementById('success');

  payBtn.textContent='Pay $'+price;

  var cardNum=document.getElementById('cardNum');
  cardNum.addEventListener('input',function(){
    var digits=cardNum.value.replace(/\D/g,'').slice(0,16);
    cardNum.value=digits.replace(/(.{4})/g,'$1 ').trim();
  });
  var cardExp=document.getElementById('cardExp');
  cardExp.addEventListener('input',function(){
    var digits=cardExp.value.replace(/\D/g,'').slice(0,4);
    if(digits.length>=3){ cardExp.value=digits.slice(0,2)+' / '+digits.slice(2); }
    else { cardExp.value=digits; }
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    err.style.display='none';

    var numOk = cardNum.value.replace(/\D/g,'').length>=13;
    var expOk = /^\d{2}\s*\/\s*\d{2}$/.test(cardExp.value.trim());
    var cvcOk = document.getElementById('cardCvc').value.trim().length>=3;
    var nameOk = document.getElementById('cardName').value.trim().length>1;

    if(!(numOk && expOk && cvcOk && nameOk)){
      err.textContent='Please check your card details.';
      err.style.display='block';
      return;
    }

    formWrap.style.display='none';
    processing.style.display='block';

    setTimeout(function(){
      var owned={ categories: bundle ? ['career','love','life','traits'] : [category], bundle: bundle };
      try{ sessionStorage.setItem('benjamin_owned', JSON.stringify(owned)); }catch(x){}

      processing.style.display='none';
      success.style.display='block';

      setTimeout(function(){
        window.location.href='/report.html';
      }, 1100);
    }, 1900);
  });
})();
</script>

</body>
</html>
